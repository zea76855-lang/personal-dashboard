<!DOCTYPE html>
<html lang="zh-CN" data-page-node-id="xVssnEFrvlYWv6DKfpftHZ">
<head data-page-node-id="QDw6OFEAKqqRvjqAqQtoeG">
<meta charset="UTF-8" data-page-node-id="BRAtaqRRS6Co19BwIhlXCl" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" data-page-node-id="SrgdufiC3Rhx5PGiGuNDZO" />
<title>个人工作台</title>
<style>
  :root{
    --text:#2B2B2B; --muted:#7A746C; --light:#ADA79D;
    --line:rgba(60,40,20,.10);
    --orange:#F97316; --orange-2:#FB923C;
    --green:#10B981; --green-2:#34D399;
    --blue:#3B82F6; --blue-2:#60A5FA;
    --purple:#A855F7; --purple-2:#C084FC;
    --glass:rgba(255,255,255,.42);
    --glass-strong:rgba(255,255,255,.62);
    --glass-line:rgba(255,255,255,.70);
    --shadow:0 10px 34px rgba(150,100,50,.14), 0 2px 8px rgba(150,100,50,.07);
    --radius:20px;
    --todo-h:380px;       /* 今日待办列固定高度，避免内容增减时抖动 */
    --module-gap:12px;    /* 全页模块之间统一间距 */
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;min-height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--text);font-size:14px;line-height:1.5;min-height:100vh;
    background:
      radial-gradient(1100px 720px at 4% -8%, rgba(255,173,96,.34), transparent 55%),
      radial-gradient(920px 620px at 102% 0%, rgba(255,214,122,.30), transparent 55%),
      radial-gradient(1000px 820px at 60% 115%, rgba(186,140,255,.22), transparent 55%),
      linear-gradient(160deg, #FDF7EF 0%, #F8F0E7 55%, #F2EAE0 100%);
    background-attachment:fixed;
  }
  .app{max-width:1160px;margin:0 auto;padding:24px 22px calc(26px + env(safe-area-inset-bottom));}

  /* ===== Header ===== */
  .app-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:16px;}
  .brand{display:flex;align-items:center;gap:13px;}
  .logo{width:46px;height:46px;border-radius:14px;flex:0 0 auto;background:linear-gradient(135deg,#FB923C,#F97316);
    display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(249,115,22,.32);}
  .logo svg{width:24px;height:24px;}
  .brand-title{font-size:22px;font-weight:800;letter-spacing:.3px;}
  .brand-tag{font-size:12.5px;color:var(--muted);margin-top:2px;letter-spacing:.4px;}
  .head-right{display:flex;align-items:center;gap:14px;}
  .date-block{text-align:right;}
  .date-text{font-size:14px;color:var(--text);font-weight:600;}
  .date-wish{font-size:12px;color:var(--orange);margin-top:2px;font-weight:500;}
  .avatar{width:42px;height:42px;border-radius:50%;flex:0 0 auto;cursor:pointer;
    background:linear-gradient(135deg,#FB923C,#F97316);color:#fff;font-weight:800;font-size:17px;
    display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(249,115,22,.30);border:2px solid rgba(255,255,255,.7);}
  /* 头像内嵌的人头 SVG — 用 currentColor 自动跟随 color:#fff */
  .avatar svg{display:block;width:60%;height:60%;}
  .avatar-lg{width:58px;height:58px;font-size:23px;border-width:3px;}
  .avatar-lg svg{width:62%;height:62%;}

  /* ===== Glass card ===== */
  .card{background:var(--glass);backdrop-filter:blur(22px) saturate(175%);-webkit-backdrop-filter:blur(22px) saturate(175%);
    border:1px solid var(--glass-line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px;margin-bottom:16px;}
  .card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;}
  .card-h h2{margin:0;font-size:16.5px;font-weight:700;display:flex;align-items:center;gap:8px;}
  .card-h h2 svg{width:17px;height:17px;color:var(--orange);}
  .card-h-right{display:flex;align-items:center;gap:12px;flex-shrink:0;}
  .more{font-size:12.5px;color:var(--muted);text-decoration:none;cursor:pointer;white-space:nowrap;}
  .more:hover{color:var(--orange);}

  /* ===== Add button (always visible) ===== */
  .add-btn{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:700;color:#fff;
    background:linear-gradient(135deg,var(--orange),var(--orange-2));border:none;border-radius:10px;
    padding:7px 13px;cursor:pointer;box-shadow:0 4px 12px rgba(249,115,22,.28);transition:.15s;white-space:nowrap;}
  .add-btn:hover{box-shadow:0 6px 16px rgba(249,115,22,.40);transform:translateY(-1px);}
  .add-btn svg{width:14px;height:14px;}

  /* ===== 2-col grid（左：今日待办；右：今日完成 + 每日一句 两个独立卡片，等高对齐左列） ===== */
  .grid-2{display:grid;grid-template-columns:1.5fr 1fr;gap:var(--module-gap);margin-bottom:var(--module-gap);align-items:stretch;}
  .grid-2 > .card{margin-bottom:0;}
  /* ===== 本周 PAD + 月度复盘 左右并排网格（与 grid-2 同 1.5fr/1fr 节奏：左列=行动类条目，右列=回顾类摘要） ===== */
  .grid-pad{display:grid;grid-template-columns:1.5fr 1fr;gap:var(--module-gap);margin-bottom:var(--module-gap);align-items:stretch;}
  .grid-pad > .card{margin-bottom:0;display:flex;flex-direction:column;min-height:0;}
  .grid-pad > .card .card-h{margin-bottom:12px;}
  .grid-pad .pad-list, .grid-pad .month-flex{flex:1;min-height:0;}

  /* ===== 今日待办（左列固定高度，列表区内部滚动） ===== */
  .card.todo-card{display:flex;flex-direction:column;height:var(--todo-h);}
  .todo-list{display:flex;flex-direction:column;flex:1;min-height:0;overflow-y:auto;}

  /* ===== 右列：今日完成 + 每日一句 两个独立卡片，与左列今日待办顶部平齐、等宽对齐 ===== */
  .col-right{display:flex;flex-direction:column;height:100%;gap:var(--module-gap);}
  .col-right > .card{margin-bottom:0;display:flex;flex-direction:column;min-height:0;}
  .col-right > .card .card-h{margin-bottom:12px;}
  .done-card{flex:1.45 1 0;min-height:0;overflow:hidden;}
  .quote-card{flex:1 1 0;min-height:0;position:relative;overflow:hidden;color:#3a2f24;
    background:linear-gradient(135deg,rgba(255,224,178,.55),rgba(255,200,150,.40));}
  .quote-card .card-h h2{color:#5a4326;}
  .quote-card .card-h h2 svg{color:#d9760f;}
  /* 今日完成：卡片内主体撑满，图例超出可滚动 */
  .done-card .done-flex{flex:1;min-height:0;justify-content:center;}
  .done-card .legend{max-height:104px;overflow-y:auto;}
  .done-card .legend::-webkit-scrollbar{width:5px;}
  .done-card .legend::-webkit-scrollbar-thumb{background:rgba(60,40,20,.18);border-radius:99px;}
  .done-card .legend::-webkit-scrollbar-track{background:transparent;}
  /* 每日一句：暖色底 + 山脉 SVG，文字居中 */
  .quote-card .q-body{position:relative;z-index:2;flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;}
  .quote-card .q-text{font-size:14px;font-weight:600;line-height:1.55;}
  .quote-card .q-sub{font-size:11.5px;color:var(--muted);margin-top:5px;}
  .quote-card svg.mt{position:absolute;right:0;bottom:0;width:180px;height:80px;opacity:.55;z-index:1;}
  .todo-row{display:grid;grid-template-columns:24px 1fr 116px 42px 16px;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);transition:.15s;}
  .todo-row:last-child{border-bottom:none;}
  .todo-row:hover{background:rgba(255,255,255,.4);border-radius:12px;padding-left:10px;padding-right:10px;}
  .status{display:flex;align-items:center;justify-content:center;cursor:pointer;width:24px;height:24px;}
  .status svg{width:22px;height:22px;}
  .status.s-todo{color:var(--light);} .status.s-doing{color:var(--orange);} .status.s-done{color:var(--green);}
  .todo-row.done .t-title{color:var(--light);text-decoration:line-through;}
  .todo-row.done .pct{color:var(--light);}
  .t-title{font-size:14.5px;font-weight:500;cursor:pointer;}
  .bar-wrap{display:flex;align-items:center;gap:9px;cursor:pointer;}
  .bar{flex:1;height:7px;background:rgba(60,40,20,.12);border-radius:99px;overflow:hidden;}
  .bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--orange),var(--orange-2));border-radius:99px;transition:.3s;}
  .bar.green > i{background:linear-gradient(90deg,var(--green),var(--green-2));}
  .pct{font-size:12.5px;color:var(--muted);font-weight:700;width:36px;text-align:right;}
  .tag{font-size:11px;font-weight:700;padding:2px 9px;border-radius:7px;flex:0 0 auto;line-height:1.5;cursor:pointer;}
  .tag.O1{background:rgba(59,130,246,.15);color:var(--blue);}
  .tag.O2{background:rgba(16,185,129,.15);color:var(--green);}
  .tag.O3{background:rgba(249,115,22,.15);color:var(--orange);}
  .tag-none{display:flex;align-items:center;justify-content:center;color:var(--light);font-weight:700;font-size:14px;}
  .chev{color:var(--light);font-size:16px;}

  /* ===== 内部滚动条（今日待办 / PAD 固定高度时） ===== */
  .todo-list::-webkit-scrollbar,.pad-list::-webkit-scrollbar{width:6px;}
  .todo-list::-webkit-scrollbar-thumb,.pad-list::-webkit-scrollbar-thumb{background:rgba(60,40,20,.18);border-radius:99px;}
  .todo-list::-webkit-scrollbar-track,.pad-list::-webkit-scrollbar-track{background:transparent;}

  /* ===== 今日完成 (ring) ===== */
  .done-flex{display:flex;align-items:center;gap:18px;}
  .ring-box{position:relative;width:118px;height:118px;flex:0 0 auto;}
  .ring-box .ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .ring-box .ring-num{font-size:22px;font-weight:800;color:var(--orange);}
  .ring-box .ring-lbl{font-size:11px;color:var(--muted);margin-top:2px;}
  .legend{display:flex;flex-direction:column;gap:9px;flex:1;}
  .legend-row{display:flex;align-items:center;gap:9px;font-size:13px;}
  .legend-dot{width:11px;height:11px;border-radius:50%;flex:0 0 auto;}
  .legend-row b{margin-left:auto;font-size:15px;font-weight:800;}

  /* ===== 本周 PAD ===== */
  /* overflow-x:hidden 显式声明：未声明时浏览器默认 overflow-x:auto，会出现一条"看不见的横向滚动条" */
  .pad-list{display:flex;flex-direction:column;overflow-x:hidden;overflow-y:auto;min-height:0;min-width:0;}
  /* 4 列：标题 | KR 标签 | 进度条+百分比 | 箭头 — 与渲染结构严格对齐，防止 grid 子项撑爆容器 */
  .pad-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto 14px;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid var(--line);min-width:0;}
  .pad-row:last-child{border-bottom:none;}
  .pad-row:hover{background:rgba(255,255,255,.4);border-radius:10px;padding-left:8px;padding-right:8px;}
  /* 标题截断：长标题省略号而不是撑爆 grid 1fr 列 */
  .pad-title{font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;}
  /* KR 标签：自然宽度，不缩 */
  .pad-row .tag{flex-shrink:0;font-size:11px;}
  /* bar-wrap：固定宽度容器，内部 bar 和 pct 左右并排 — 同步对齐，宽度/百分比不会再漂 */
  .pad-row .bar-wrap{position:relative;width:108px;display:flex;align-items:center;gap:7px;min-width:0;flex-shrink:0;cursor:pointer;}
  .pad-row .bar-wrap .bar{display:block;flex:1;height:7px;min-width:0;}
  .pad-row .bar-wrap .pct{position:static;width:30px;flex-shrink:0;font-size:11px;color:var(--muted);font-weight:700;text-align:right;background:transparent;}
  /* 箭头列 */
  .pad-row .chev{min-width:0;flex-shrink:0;font-size:14px;color:var(--muted);}

  /* ===== 季度 OKR ===== */
  .okr-total{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--muted);}
  .okr-total b{color:var(--text);font-weight:800;}
  .okr-total .obar{width:120px;height:7px;background:rgba(60,40,20,.12);border-radius:99px;overflow:hidden;}
  .okr-total .obar > i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--green-2));border-radius:99px;}
  .okr-head-r{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end;}
  .okr-cols{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:4px;}
  .okr-col{background:rgba(255,255,255,.42);border:1px solid var(--glass-line);border-radius:14px;padding:14px 16px;transition:.15s;}
  .okr-col .oh{display:flex;align-items:center;gap:8px;margin-bottom:9px;}
  .okr-col .otitle{flex:1;font-size:14.5px;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .okr-col .obp{font-size:13px;font-weight:800;color:var(--text);}
  .obar2{height:7px;background:rgba(60,40,20,.12);border-radius:99px;overflow:hidden;}
  .obar2 > i{display:block;height:100%;border-radius:99px;}
  .okr-col.O1 .obar2 > i{background:linear-gradient(90deg,var(--blue),var(--blue-2));}
  .okr-col.O2 .obar2 > i{background:linear-gradient(90deg,var(--green),var(--green-2));}
  .okr-col.O3 .obar2 > i{background:linear-gradient(90deg,var(--orange),var(--orange-2));}
  .kr-list{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px;display:flex;flex-direction:column;gap:4px;}
  .kr-row{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:12.5px;}
  .kr-no{color:var(--muted);font-weight:600;width:38px;flex:0 0 auto;}
  .kr-title{flex:1;color:var(--text);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .kr-pct{font-weight:700;color:var(--text);width:40px;text-align:right;flex:0 0 auto;}

  /* ===== 月度复盘 ===== */
  .month-flex{display:flex;align-items:flex-start;gap:18px;}
  .month-lbl{width:60px;height:60px;border-radius:15px;flex:0 0 auto;background:linear-gradient(135deg,#FB923C,#F97316);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:800;box-shadow:0 6px 18px rgba(249,115,22,.30);}
  .month-body{flex:1;}
  .month-summary{display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:13.5px;color:var(--muted);margin-bottom:10px;}
  .month-summary b{color:var(--text);font-weight:800;font-size:15px;}
  .month-summary .sep{width:1px;height:16px;background:var(--line);}
  .hl-list{display:flex;flex-direction:column;gap:6px;}
  .hl-row{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text);}
  .hl-row svg{width:15px;height:15px;color:var(--orange);flex:0 0 auto;}
  .hl-empty{font-size:12.5px;color:var(--light);}

  /* ===== Add form ===== */
  .addform{margin-top:13px;padding:13px;background:rgba(255,255,255,.55);border:1px solid var(--line);border-radius:13px;display:flex;flex-direction:column;gap:9px;}
  .addform.hidden{display:none;}
  .addform input,.addform select{font-family:inherit;font-size:13.5px;border:1px solid var(--line);border-radius:9px;padding:8px 11px;background:#fff;color:var(--text);width:100%;outline:none;}
  .addform input:focus,.addform select:focus{border-color:var(--orange);box-shadow:0 0 0 3px rgba(249,115,22,.12);}
  .addform .row{display:flex;gap:8px;}
  .addform .row > *{flex:1;}
  .btn-save{background:linear-gradient(135deg,var(--orange),var(--orange-2));color:#fff;border:none;border-radius:9px;padding:9px 14px;font-weight:700;font-size:13px;cursor:pointer;flex:0 0 auto;}
  .btn-save:hover{box-shadow:0 6px 16px rgba(249,115,22,.30);}

  /* ===== Footer / toast ===== */
  /* foot 已迁移至个人中心弹窗：保留 DOM 仅供旧 JS 引用，强制隐藏 */
  .foot{display:flex;justify-content:center;gap:14px;padding:8px 0 2px;font-size:12px;color:var(--light);}
  .foot[hidden]{display:none !important;}
  .foot a{cursor:pointer;color:var(--muted);text-decoration:none;}
  .foot a:hover{color:var(--orange);}
  .hint{font-size:12.5px;color:var(--light);text-align:center;padding:12px 0;}
  .toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(43,43,43,.92);color:#fff;font-size:13px;padding:10px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:200;backdrop-filter:blur(6px);box-shadow:0 8px 24px rgba(0,0,0,.20);max-width:calc(100vw - 32px);text-align:center;}
  .toast.show{opacity:1;}

  /* ===== 月度复盘弹窗 ===== */
  .modal-mask{position:fixed;inset:0;z-index:100;background:rgba(45,28,12,.40);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
    display:flex;align-items:center;justify-content:center;padding:24px;animation:mask-in .22s ease;}
  .modal-mask.hidden{display:none;}
  .modal{width:min(720px,100%);max-height:86vh;display:flex;flex-direction:column;overflow:hidden;
    background:var(--glass-strong);backdrop-filter:blur(26px) saturate(180%);-webkit-backdrop-filter:blur(26px) saturate(180%);
    border:1px solid var(--glass-line);border-radius:22px;box-shadow:0 26px 70px rgba(90,60,30,.30);
    animation:modal-in .28s cubic-bezier(.2,.7,.2,1);}
  .modal-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:17px 22px;border-bottom:1px solid var(--line);flex:0 0 auto;}
  .modal-h h2{margin:0;font-size:17px;font-weight:800;display:flex;align-items:center;gap:9px;}
  .modal-h h2 svg{width:19px;height:19px;color:var(--orange);}
  .modal-x{width:34px;height:34px;flex:0 0 auto;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.62);
    color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .modal-x:hover{background:rgba(255,255,255,.92);color:var(--text);}
  .modal-x svg{width:17px;height:17px;}
  .modal-body{padding:18px 22px 22px;overflow-y:auto;flex:1;min-height:0;}
  /* 复盘：核心数据 */
  .rv-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px;}
  .rv-stat{background:rgba(255,255,255,.55);border:1px solid var(--glass-line);border-radius:14px;padding:13px 12px;text-align:center;}
  .rv-stat b{display:block;font-size:23px;font-weight:800;color:var(--text);line-height:1.25;}
  .rv-stat span{font-size:11.5px;color:var(--muted);}
  .rv-sec{margin-bottom:17px;}
  .rv-sec:last-child{margin-bottom:0;}
  .rv-sec-t{font-size:13px;font-weight:800;color:var(--text);margin-bottom:8px;display:flex;align-items:center;gap:7px;}
  .rv-sec-t svg{width:15px;height:15px;color:var(--orange);}
  /* 复盘：OKR 贡献分布 */
  .rv-okr{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);}
  .rv-okr:last-child{border-bottom:none;}
  .rv-okr-name{flex:1;font-size:13.5px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .rv-okr-bar{width:104px;height:7px;background:rgba(60,40,20,.12);border-radius:99px;overflow:hidden;flex:0 0 auto;}
  .rv-okr-bar > i{display:block;height:100%;border-radius:99px;}
  .rv-okr-n{font-size:12.5px;font-weight:800;width:76px;text-align:right;flex:0 0 auto;}
  /* 复盘：亮点 / 未完成条目 */
  .rv-item{display:flex;align-items:flex-start;gap:9px;font-size:13.5px;padding:8px 0;border-bottom:1px solid var(--line);line-height:1.5;}
  .rv-item:last-child{border-bottom:none;}
  .rv-item > svg{width:15px;height:15px;flex:0 0 auto;margin-top:3px;color:var(--orange);}
  .rv-item.warn > svg{color:#DC2626;}
  .rv-late{color:#DC2626;font-weight:700;}
  .rv-empty{font-size:12.5px;color:var(--light);padding:6px 0;}

  /* ===== PAD 详情弹窗 ===== */
  .pd-title{font-size:16.5px;font-weight:700;line-height:1.5;margin:0 0 16px;}
  .pd-title .tag{margin-left:8px;font-size:12px;vertical-align:middle;}
  .pd-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);}

  @keyframes card-in{

  @keyframes soft-in{

  @keyframes mask-in{

  .todo-row,.pad-row{transition:background .15s ease,padding .15s ease;}
