<title>个人工作台</title>
<style>
  :root{
    --blue:#2F6BFF; --blue-soft:#EAF1FF; --green:#16A34A; --green-soft:#E7F6EC;
    --red:#EF4444; --red-soft:#FDECEC; --amber:#F59E0B;
    --text:#1F2937; --muted:#6B7280; --line:#E5E7EB; --bg:#F5F7FA; --card:#FFFFFF;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    width:380px;min-height:520px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--text);font-size:14px;
  }
  .app{width:100%;max-width:400px;margin:0 auto;padding:12px 12px calc(12px + env(safe-area-inset-bottom));}
  /* Header */
  header{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
  .logo{width:30px;height:30px;border-radius:8px;background:var(--blue);display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
  .logo svg{width:18px;height:18px;}
  .brand{font-size:15px;font-weight:700;flex:0 0 auto;}
  .date{font-size:12px;color:var(--muted);margin-left:2px;}
  .spacer{flex:1 1 auto;}
  .btn-ghost{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 8px;font-size:12px;color:var(--text);cursor:pointer;min-height:34px;}
  .btn-ghost svg{width:14px;height:14px;}
  /* Today card */
  .today{background:linear-gradient(135deg,#2F6BFF,#5B8DEF);border-radius:14px;padding:12px 14px;color:#fff;margin-bottom:12px;}
  .today h3{margin:0 0 8px;font-size:13px;display:flex;align-items:center;gap:6px;opacity:.95;}
  .today h3 svg{width:15px;height:15px;}
  .today .empty{font-size:12px;opacity:.85;}
  .titem{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.14);border-radius:9px;padding:7px 9px;margin-top:6px;}
  .titem .tt{font-size:12.5px;flex:1;line-height:1.3;}
  .titem .tag{font-size:10.5px;padding:2px 6px;border-radius:20px;background:rgba(255,255,255,.22);white-space:nowrap;}
  .titem.over .tag{background:var(--red);color:#fff;}
  .titem .mini{border:none;background:#fff;color:var(--blue);font-size:11.5px;font-weight:600;border-radius:7px;padding:5px 9px;cursor:pointer;min-height:30px;}
  /* Tabs */
  .tabs{display:flex;background:#fff;border-radius:12px;padding:4px;gap:4px;box-shadow:0 1px 2px rgba(16,24,40,.04);margin-bottom:12px;}
  .tab{flex:1;border:none;background:transparent;border-radius:9px;padding:9px 4px;font-size:12.5px;color:var(--muted);cursor:pointer;font-weight:600;min-height:40px;}
  .tab.active{background:var(--blue-soft);color:var(--blue);}
  /* Panels */
  .panel{display:none;}
  .panel.active{display:block;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;}
  .card h4{margin:0 0 10px;font-size:13px;display:flex;align-items:center;gap:6px;}
  .card h4 svg{width:15px;height:15px;color:var(--blue);}
  /* Forms */
  .row{display:flex;gap:6px;flex-wrap:wrap;}
  input,select,textarea{font-family:inherit;font-size:14px;border:1px solid var(--line);border-radius:9px;padding:9px 10px;background:#fff;color:var(--text);width:100%;}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue);}
  textarea{resize:vertical;min-height:34px;}
  .field{margin-bottom:7px;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;border:none;background:var(--blue);color:#fff;border-radius:9px;padding:9px 12px;font-size:13px;font-weight:600;cursor:pointer;min-height:40px;}
  .btn svg{width:15px;height:15px;}
  .btn.sm{padding:6px 10px;font-size:12px;min-height:34px;}
  .btn.ghost{background:#fff;border:1px solid var(--line);color:var(--text);}
  .btn.green{background:var(--green);}
  /* Must-do list */
  .mitem{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);}
  .mitem:last-child{border-bottom:none;}
  .check{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:0 0 auto;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .check svg{width:13px;height:13px;opacity:0;}
  .mitem.done .check{background:var(--green);border-color:var(--green);}
  .mitem.done .check svg{opacity:1;}
  .mitem.done .mt{color:var(--muted);text-decoration:line-through;}
  .mt{flex:1;font-size:13.5px;}
  .streak{font-size:11px;color:var(--amber);background:#FFF7E6;padding:2px 7px;border-radius:20px;white-space:nowrap;display:inline-flex;align-items:center;gap:3px;}
  .streak svg{width:11px;height:11px;}
  .icon-btn{border:none;background:transparent;color:var(--muted);cursor:pointer;padding:4px;min-height:30px;min-width:30px;}
  /* Task list */
  .tbitem{display:flex;align-items:flex-start;gap:9px;padding:10px 0;border-bottom:1px solid var(--line);}
  .tbitem:last-child{border-bottom:none;}
  .pri{font-size:10px;font-weight:700;padding:2px 6px;border-radius:6px;flex:0 0 auto;margin-top:1px;}
  .pri.P0{background:var(--red-soft);color:var(--red);}
  .pri.P1{background:var(--blue-soft);color:var(--blue);}
  .pri.P2{background:#EEF2F6;color:var(--muted);}
  .tbmain{flex:1;min-width:0;}
  .tbt{font-size:13.5px;font-weight:600;}
  .tbn{font-size:12px;color:var(--muted);margin-top:2px;white-space:pre-wrap;word-break:break-word;}
  .tbd{font-size:11px;color:var(--muted);margin-top:3px;}
  .tbitem.over .tbt{color:var(--red);}
  .tbact{display:flex;flex-direction:column;gap:4px;flex:0 0 auto;}
  /* Progress board */
  .ring-wrap{display:flex;align-items:center;gap:14px;margin-bottom:6px;}
  .ring{position:relative;width:74px;height:74px;flex:0 0 auto;}
  .ring .pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:var(--blue);}
  .ring-track{stroke:#E5E7EB;}
  .ring-val{stroke:var(--blue);}
  .legend{font-size:12px;color:var(--muted);line-height:1.7;}
  .kanban{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .col{background:#F8FAFC;border:1px solid var(--line);border-radius:10px;padding:8px;min-height:90px;}
  .col h5{margin:0 0 7px;font-size:11.5px;color:var(--muted);display:flex;justify-content:space-between;}
  .kchip{background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 7px;font-size:12px;margin-bottom:6px;cursor:pointer;line-height:1.3;}
  .kchip .kpri{font-size:9.5px;font-weight:700;margin-right:4px;}
  .kcol-actions{display:flex;gap:4px;margin-top:4px;}
  .kcol-actions button{flex:1;border:1px solid var(--line);background:#fff;border-radius:6px;font-size:10.5px;padding:3px;cursor:pointer;color:var(--muted);min-height:26px;}
  /* OKR */
  .obj{background:#F8FAFC;border:1px solid var(--line);border-radius:11px;padding:11px;margin-bottom:10px;}
  .obj .ot{font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:6px;}
  .obj .om{font-size:11px;color:var(--muted);margin:2px 0 8px;}
  .obar{height:8px;background:#E5E7EB;border-radius:6px;overflow:hidden;margin-bottom:4px;}
  .obar > i{display:block;height:100%;background:linear-gradient(90deg,#2F6BFF,#16A34A);border-radius:6px;}
  .opct{font-size:11.5px;color:var(--muted);margin-bottom:8px;}
  .kr{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px dashed var(--line);}
  .kr:first-of-type{border-top:none;}
  .kr .krmain{flex:1;min-width:0;}
  .kr .krt{font-size:12.5px;}
  .kr .krv{font-size:11px;color:var(--muted);}
  .krbar{height:6px;background:#E5E7EB;border-radius:5px;overflow:hidden;margin-top:4px;}
  .krbar > i{display:block;height:100%;background:var(--blue);border-radius:5px;}
  .kr input[type=range]{width:90px;flex:0 0 auto;accent-color:var(--blue);}
  .krpct{font-size:11.5px;font-weight:700;color:var(--blue);width:38px;text-align:right;flex:0 0 auto;}
  .hint{font-size:11.5px;color:var(--muted);margin-top:6px;}
  .toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#1F2937;color:#fff;font-size:12.5px;padding:9px 14px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:50;}
  .toast.show{opacity:.96;}
  @media (max-width:380px){
    body{width:100%;}
    .app{padding:10px;}
  }
</style>
