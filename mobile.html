<title>个人工作台</title>
<style>
/* ==========================================================
   基础与主题（沿用项目暖色毛玻璃语言）
   ========================================================== */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;margin:0;padding:0;overflow:hidden;}
:root{
  --text:#2B2B2B; --muted:#7A746C; --light:#ADA79D;
  --line:rgba(60,40,20,.10);
  --orange:#F97316; --orange-2:#FB923C;
  --green:#10B981; --green-2:#34D399;
  --blue:#3B82F6; --blue-2:#60A5FA;
  --red:#DC2626;
  --glass:rgba(255,255,255,.60);
  --glass-line:rgba(255,255,255,.74);
  --shadow:0 8px 26px rgba(150,100,50,.13), 0 1px 4px rgba(150,100,50,.06);
  --radius:18px;
  --nav-h:58px;
  /* 内容列宽：手机=100%，平板/桌面由媒体查询逐级放大 */
  --col:100%;
  --safe-t:env(safe-area-inset-top, 0px);
  --safe-b:env(safe-area-inset-bottom, 0px);
}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",Roboto,sans-serif;
  color:var(--text); font-size:15px; line-height:1.5;
  background:linear-gradient(165deg,#FDF7EF 0%,#F8F0E7 48%,#F3EAE0 100%);
  -webkit-font-smoothing:antialiased;
  -webkit-text-size-adjust:100%;
}
/* 背景光斑：玻璃卡片的折射来源 */
body::before{
  content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
  background:
    radial-gradient(680px 480px at 8% -6%, rgba(255,173,96,.30), transparent 58%),
    radial-gradient(620px 460px at 100% 4%, rgba(255,214,122,.26), transparent 58%),
    radial-gradient(700px 560px at 50% 112%, rgba(186,140,255,.18), transparent 58%);
}
button,input,textarea,select{font-family:inherit;font-size:16px;color:inherit;}
button{border:none;background:none;padding:0;cursor:pointer;}

/* ==========================================================
   骨架：fixed 容器 + 顶栏 + 页面栈 + 底部 Tab
   ========================================================== */
.app{position:fixed;inset:0;z-index:1;display:flex;flex-direction:column;}

/* 顶栏：padding-top 吃掉 iOS 刘海安全区，背景延伸到状态栏 */
.topbar{
  flex:0 0 auto; position:relative; z-index:5;
  padding:calc(10px + var(--safe-t)) 16px 10px;
  display:flex; align-items:center; gap:11px;
  background:rgba(255,255,255,.72);
  backdrop-filter:blur(18px) saturate(170%); -webkit-backdrop-filter:blur(18px) saturate(170%);
  border-bottom:1px solid var(--line);
}
.avatar{
  width:40px;height:40px;flex:0 0 auto;border-radius:13px;
  background:linear-gradient(135deg,var(--orange-2),var(--orange));
  color:#fff;font-weight:800;font-size:15px;letter-spacing:.5px;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 12px rgba(249,115,22,.28);
}
.avatar svg{display:block;width:62%;height:62%;}
.tb-txt{flex:1;min-width:0;}
.tb-hi{font-size:16.5px;font-weight:800;line-height:1.25;}
.tb-date{font-size:12px;color:var(--muted);margin-top:1px;}
.tb-pct{
  flex:0 0 auto;font-size:12.5px;font-weight:800;color:var(--orange);
  background:rgba(249,115,22,.12);border-radius:99px;padding:5px 11px;
}

/* 页面栈：各页面绝对定位重叠，靠 visibility 隐藏 —— DOM 不销毁、滚动位置不丢 */
.pages{position:relative;flex:1 1 auto;min-height:0;z-index:1;}
.page{
  position:absolute; inset:0;
  overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior-y:contain;
  padding:12px 14px 26px;
  visibility:hidden; opacity:0; pointer-events:none;
  transition:opacity .16s ease, visibility 0s linear .16s;
}
.page.is-active{visibility:visible;opacity:1;pointer-events:auto;transition:opacity .16s ease, visibility 0s;}

/* 底部 Tab：固定在视口底部，padding-bottom 吃掉 home 横条安全区 */
.tabbar{
  flex:0 0 auto; position:relative; z-index:20;
  display:flex; align-items:stretch;
  height:calc(var(--nav-h) + var(--safe-b));
  padding-bottom:var(--safe-b);
  background:rgba(255,255,255,.78);
  backdrop-filter:blur(20px) saturate(175%); -webkit-backdrop-filter:blur(20px) saturate(175%);
  border-top:1px solid var(--line);
  box-shadow:0 -2px 14px rgba(150,100,50,.07);
}
.tab{
  flex:1; position:relative; min-height:44px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  color:var(--light); font-size:11px; font-weight:600;
  transition:color .16s;
}
.tab > svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.tab.is-active{color:var(--orange);font-weight:800;}
/* 选中态顶部指示条 */
.tab.is-active::before{
  content:''; position:absolute; top:0; left:50%; transform:translateX(-50%);
  width:26px; height:3px; border-radius:0 0 3px 3px; background:var(--orange);
}

/* ==========================================================
   通用卡片 / 列表 / 标签
   ========================================================== */
.card{
  background:var(--glass); border:1px solid var(--glass-line); border-radius:var(--radius);
  padding:14px 15px; margin-bottom:12px; box-shadow:var(--shadow);
  backdrop-filter:blur(18px) saturate(170%); -webkit-backdrop-filter:blur(18px) saturate(170%);
}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:11px;}
.card-h h2{margin:0;font-size:15.5px;font-weight:800;display:flex;align-items:center;gap:7px;}
.card-h h2 > svg{width:17px;height:17px;color:var(--orange);stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.cnt{font-size:12px;font-weight:800;color:var(--muted);background:rgba(60,40,20,.07);border-radius:99px;padding:3px 9px;}
.more{font-size:12.5px;font-weight:700;color:var(--orange);text-decoration:none;}
.mini-btn{
  width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  background:rgba(249,115,22,.12);color:var(--orange);
}
.mini-btn > svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;}

.tag{font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:6px;flex:0 0 auto;line-height:1.45;}
.tag.P0{background:rgba(220,38,38,.13);color:var(--red);}
.tag.P1{background:rgba(249,115,22,.14);color:var(--orange);}
.tag.P2{background:rgba(60,40,20,.09);color:var(--muted);}
.tag.O1{background:rgba(59,130,246,.14);color:var(--blue);}
.tag.O2{background:rgba(16,185,129,.15);color:var(--green);}
.tag.O3{background:rgba(249,115,22,.14);color:var(--orange);}

.hint{font-size:13px;color:var(--light);text-align:center;padding:16px 8px;line-height:1.6;}
.note{font-size:12px;color:var(--muted);line-height:1.6;margin-top:8px;}

/* 新增待办输入条 */
.addbar{display:flex;gap:8px;margin-bottom:10px;}
.addbar select.pad-kr,.addbar input{flex:1;min-width:0;}
.addbar input{
  flex:1;min-width:0;height:44px;padding:0 13px;font-size:16px;
  border-radius:13px;border:1px solid var(--line);background:rgba(255,255,255,.72);outline:none;
}
.addbar input:focus{border-color:rgba(249,115,22,.5);background:rgba(255,255,255,.92);}
/* PAD 关联 KR 下拉：与输入框同一视觉，窄屏自动缩、不挤爆 */
.addbar select.pad-kr{
  flex:0 1 132px;height:44px;padding:0 10px;font-size:14px;
  border-radius:13px;border:1px solid var(--line);background:rgba(255,255,255,.82);
  color:var(--text);outline:none;-webkit-appearance:none;appearance:none;
}
.addbar select.pad-kr:focus{border-color:rgba(249,115,22,.5);}
@media (max-width:400px){ .addbar{flex-wrap:wrap;} .addbar select.pad-kr{flex:1 1 100%;} }
.add-go{
  width:46px;height:44px;flex:0 0 auto;border-radius:13px;font-size:22px;font-weight:600;
  background:linear-gradient(135deg,var(--orange-2),var(--orange));color:#fff;
  display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(249,115,22,.26);
}

/* 待办行 */
.todo{display:flex;align-items:flex-start;gap:11px;padding:10px 0;border-bottom:1px solid var(--line);}
.todo:last-child{border-bottom:none;}
.chk{
  width:24px;height:24px;flex:0 0 auto;margin-top:1px;border-radius:8px;
  border:2px solid rgba(60,40,20,.22);background:rgba(255,255,255,.6);
  display:flex;align-items:center;justify-content:center;color:#fff;
}
.chk > svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0;}
.chk.on{background:linear-gradient(135deg,var(--green-2),var(--green));border-color:transparent;}
.chk.on > svg{opacity:1;}
.t-body{flex:1;min-width:0;}
.t-title{font-size:14.5px;font-weight:600;line-height:1.45;word-break:break-word;}
.todo.done .t-title{color:var(--light);text-decoration:line-through;}
.t-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:5px;}
.t-date{font-size:11.5px;color:var(--muted);}
.t-date.late{color:var(--red);font-weight:700;}
.del{
  width:34px;height:34px;flex:0 0 auto;border-radius:10px;color:var(--light);
  display:flex;align-items:center;justify-content:center;
}
.del > svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}

/* 完成率概览 */
.stat-card{display:flex;align-items:center;gap:16px;}
.ring-wrap{position:relative;width:104px;height:104px;flex:0 0 auto;}
.ring{width:104px;height:104px;display:block;transform:rotate(-90deg);}
.ring-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.ring-c b{font-size:24px;font-weight:800;line-height:1.1;}
.ring-c span{font-size:11px;color:var(--muted);margin-top:2px;}
.stat-side{flex:1;min-width:0;display:flex;flex-direction:column;gap:9px;}
.stat-row{display:flex;align-items:baseline;gap:7px;}
.stat-row b{font-size:19px;font-weight:800;min-width:26px;}
.stat-row span{font-size:12px;color:var(--muted);}
.stat-row.late b{color:var(--red);}

/* PAD 行 */
.pad{display:flex;flex-direction:column;gap:7px;padding:11px 0;border-bottom:1px solid var(--line);}
.pad:last-child{border-bottom:none;}
.pad-t{display:flex;align-items:center;gap:8px;}
.pad-title{flex:1;min-width:0;font-size:14.5px;font-weight:600;line-height:1.4;}
.pad-pct{font-size:12.5px;font-weight:800;flex:0 0 auto;}
.bar{height:7px;background:rgba(60,40,20,.12);border-radius:99px;overflow:hidden;}
.bar > i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--orange-2),var(--orange));}
.pad-m{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);}

/* 月度 / 季度 统计格 */
.grid-stat{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;}
.gs{background:rgba(255,255,255,.55);border:1px solid var(--glass-line);border-radius:13px;padding:11px 8px;text-align:center;}
.gs b{display:block;font-size:20px;font-weight:800;line-height:1.2;}
.gs span{font-size:11px;color:var(--muted);}

/* 亮点 / 条目行 */
.li{display:flex;align-items:flex-start;gap:9px;font-size:13.5px;padding:8px 0;border-bottom:1px solid var(--line);line-height:1.5;}
.li:last-child{border-bottom:none;}
.li > svg{width:15px;height:15px;flex:0 0 auto;margin-top:3px;color:var(--orange);stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;}
.li.warn > svg{color:var(--red);}
.li-late{color:var(--red);font-weight:700;}

/* 季度图表 */
.q-chart{width:100%;height:auto;display:block;}
.q-obj{background:rgba(255,255,255,.5);border:1px solid var(--glass-line);border-radius:14px;padding:11px 12px;margin-bottom:9px;}
.q-obj:last-child{margin-bottom:0;}
.q-obj-h{display:flex;align-items:center;gap:8px;margin-bottom:7px;}
.q-obj-name{flex:1;min-width:0;font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.q-obj-pct{font-size:13.5px;font-weight:800;flex:0 0 auto;}
.q-kr{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:12.5px;}
.q-kr-no{color:var(--muted);font-weight:700;width:28px;flex:0 0 auto;}
.q-kr-title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.q-kr-bar{width:52px;height:6px;background:rgba(60,40,20,.12);border-radius:99px;overflow:hidden;flex:0 0 auto;}
.q-kr-bar > i{display:block;height:100%;border-radius:99px;}
.q-kr-n{font-weight:800;width:62px;text-align:right;flex:0 0 auto;font-size:12px;}

/* 我的 / 设置 */
.me-head{display:flex;align-items:center;gap:13px;}
.me-avatar{
  width:50px;height:50px;flex:0 0 auto;border-radius:16px;
  background:linear-gradient(135deg,var(--orange-2),var(--orange));color:#fff;
  font-weight:800;font-size:18px;display:flex;align-items:center;justify-content:center;
  box-shadow:0 5px 14px rgba(249,115,22,.26);
}
.me-name{font-size:16px;font-weight:800;}
.me-sub{font-size:12px;color:var(--muted);margin-top:2px;}
.cell{
  width:100%;min-height:52px;display:flex;align-items:center;gap:11px;
  padding:9px 0;border-bottom:1px solid var(--line);text-align:left;
}
.cell:last-child{border-bottom:none;}
.cell > svg{width:19px;height:19px;flex:0 0 auto;color:var(--orange);stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.cell-txt{flex:1;min-width:0;}
.cell-t{font-size:14.5px;font-weight:600;}
.cell-s{font-size:11.5px;color:var(--muted);margin-top:2px;}
.cell.danger > svg{color:var(--red);}
.cell.danger .cell-t{color:var(--red);}
.cell .chev{width:15px;height:15px;flex:0 0 auto;color:var(--light);stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;}
.tip{font-size:11.5px;color:var(--light);line-height:1.65;padding:2px 4px 6px;text-align:center;}
.link{font-size:12px;color:var(--orange);font-weight:700;text-align:center;padding:8px;display:block;}

/* 隐藏（新增表单等） */
.hidden{display:none !important;}

/* ==========================================================
   确认弹层（底部 sheet，二次确认统一走这里）
   ========================================================== */
.mask{
  position:fixed; inset:0; z-index:100;
  background:rgba(45,28,12,.42); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
  display:flex; align-items:flex-end; justify-content:center;
}
.mask.hidden{display:none;}
.sheet{
  width:100%; max-width:460px; margin:0 auto 0;
  background:rgba(255,255,255,.94); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
  border-radius:22px 22px 0 0; padding:20px 18px calc(18px + var(--safe-b));
  box-shadow:0 -8px 34px rgba(80,50,20,.20);
  animation:up .22s cubic-bezier(.22,1,.36,1);
}
@keyframes up{from{transform:translateY(100%);}to{transform:translateY(0);}}
.sheet-t{font-size:16.5px;font-weight:800;margin-bottom:7px;}
.sheet-d{font-size:13.5px;color:var(--muted);line-height:1.6;margin-bottom:17px;}
.sheet-btns{display:flex;gap:10px;}
.sbtn{
  flex:1;height:48px;border-radius:14px;font-size:15px;font-weight:700;
  display:flex;align-items:center;justify-content:center;
}
.sbtn.ghost{background:rgba(60,40,20,.07);color:var(--text);}
.sbtn.danger{background:linear-gradient(135deg,#F87171,var(--red));color:#fff;box-shadow:0 5px 14px rgba(220,38,38,.24);}
.sbtn.primary{background:linear-gradient(135deg,var(--orange-2),var(--orange));color:#fff;box-shadow:0 5px 14px rgba(249,115,22,.24);}

/* Toast */
.toast{
  position:fixed; left:50%; transform:translateX(-50%);
  bottom:calc(var(--nav-h) + var(--safe-b) + 18px);
  background:rgba(43,43,43,.93); color:#fff; font-size:13px; font-weight:600;
  padding:11px 18px; border-radius:13px; opacity:0; pointer-events:none;
  transition:opacity .24s; z-index:200; max-width:calc(100vw - 40px); text-align:center;
  backdrop-filter:blur(6px); box-shadow:0 8px 24px rgba(0,0,0,.20);
}
.toast.show{opacity:1;}

/* ===== 断点 1｜平板 / 窄桌面：内容居中限宽，底部导航同步限宽 =====
   注意：flex 容器里的 .tabbar 一旦用 margin:0 auto，auto 边距会让 stretch 失效，
   宽度退化为 fit-content（曾经缩成 93px），所以必须显式给 width:100%。 */
@media (min-width:720px){
  :root{--col:660px;}
  .page,.topbar{padding-left:calc(50% - var(--col)/2);padding-right:calc(50% - var(--col)/2);}
  .tabbar{width:100%;max-width:var(--col);margin:0 auto;border-radius:20px 20px 0 0;
    box-shadow:0 -2px 14px rgba(150,100,50,.07), 0 0 0 1px var(--line);}
}

/* ===== 断点 2｜桌面：内容区加宽，卡片双栏铺开，减少纵向滚动 ===== */
@media (min-width:1000px){
  :root{--col:880px;}
  .page{
    display:grid; grid-template-columns:repeat(2,minmax(0,1fr));
    gap:14px; align-content:start;
  }
  .page > .card{margin-bottom:0;}
  /* 首页：统计卡通栏，待办 / 已完成左右分栏 */
  #pageHome > .stat-card{grid-column:1 / -1;}
  /* OKR 页：统计 + 图表并排，明细通栏，亮点 / 待改进并排 */
  #pageOkr > .card:nth-child(3){grid-column:1 / -1;}
  /* 我的：个人信息通栏，数据概览 / 设置中心左右分栏 */
  #pageMe > .me-head{grid-column:1 / -1;}
}

/* ===== 断点 3｜宽屏：进一步放宽并加大卡片呼吸感 ===== */
@media (min-width:1360px){
  :root{--col:1120px;}
  .page{gap:16px;}
  .card{padding:16px 18px;}
}
</style>
